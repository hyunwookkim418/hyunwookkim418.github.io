---
layout: default
---

<article class="article">

  <header class="article-header">

    <div class="breadcrumb">
      {{ page.category }}
    </div>

    <h1>
      {{ page.title }}
    </h1>

    <div class="article-meta">
      {{ page.date | date: "%B %d, %Y" }}
    </div>

  </header>

  {{ content }}

</article>
